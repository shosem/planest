services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: /bin/bash
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RAILS_ENV: development
      SELENIUM_DRIVER_URL: ${SELENIUM_DRIVER_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      RAILS_DEVELOPMENT_HOSTS: "localhost,127.0.0.1,web"
      RAILS_LOG_TO_STDOUT: "true"
      PORT: "3000"
      HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true
    develop:
      watch:
        - path: .
          action: sync
          target: /app
          ignore:
            - node_modules
            - tmp
            - log
            - vendor

  chrome:
    image: selenium/standalone-chromium
    shm_size: 2gb

volumes:
  postgres_data:
  bundle_data: